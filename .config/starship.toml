"$schema" = 'https://starship.rs/config-schema.json'

format = """
$hostname\
$directory\
$git_branch\
$git_metrics\
$git_status\
${custom.gh_user}\
$fill\
$python\
$lua\
$nodejs\
$golang\
$docker_context\
$rust\
$package\
$cmd_duration\
$line_break\
$character"""

add_newline = true

[hostname]
ssh_only = true
ssh_symbol = ' '
format = '[$ssh_symbol]($style)'
style = 'bold fg:yellow'

[directory]
style = 'bold fg:blue'
format = '[$path ]($style)'
truncation_length = 4
truncation_symbol = '…/'
truncate_to_repo = false

[git_branch]
style = 'fg:green'
symbol = ' '
format = '[on](white) [$symbol$branch ]($style)'
truncation_length = 24
truncation_symbol = '…'

[git_state]
format = '[\($state( $progress_current/$progress_total)\)]($style) '
style = 'bold yellow'

[git_metrics]
disabled = false
added_style = 'fg:green'
deleted_style = 'fg:red'
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'

[git_status]
style = 'fg:green'
format = '([$all_status$ahead_behind]($style) )'

[custom.gh_user]
# Active account is written by gh to hosts.yml (updated by `gh auth login/switch`)
command = '''awk '/^github.com:/{h=1;next} /^[^ ]/{h=0} h && $1=="user:"{print $2; exit}' "${GH_CONFIG_DIR:-$HOME/.config/gh}/hosts.yml"'''
require_repo = true
when = true
shell = ['sh']
format = '[$symbol$output ]($style)'
symbol = ' '
style = 'fg:cyan'

[fill]
symbol = ' '

[package]
symbol = '󰏗 '

[lua]
symbol = ' '

[nodejs]
style = 'fg:green'
symbol = ' '

[python]
style = 'fg:yellow'
symbol = ' '
format = '[${symbol}(${version} )]($style)'

[docker_context]
symbol = ' '
style = 'fg:#06969A'
format = '[$symbol]($style) $path'
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
detect_extensions = ['Dockerfile']

[cmd_duration]
min_time = 1000
style = 'fg:cyan'
format = '[$duration]($style)'
